services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rpd
      POSTGRES_PASSWORD: rpd
      POSTGRES_DB: rpd
    ports:
      - "5432:5432"
    volumes:
      - rpd-postgres:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpd -d rpd"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  rpd-postgres:
