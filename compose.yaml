services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rpd
      POSTGRES_PASSWORD: rpd
      POSTGRES_DB: rpd
    ports:
      - "5432:5432"
    volumes:
      - rpd-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpd -d rpd"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: rpd
    volumes:
      - ./database/migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - |
        for migration in /migrations/*.sql; do
          echo "Applying $$migration"
          psql -h postgres -U rpd -d rpd -v ON_ERROR_STOP=1 -f "$$migration"
        done
    restart: "no"

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - rpd-nats:/data
    restart: unless-stopped

  ai-engine:
    build:
      context: .
      dockerfile: apps/ai-engine/Dockerfile
    environment:
      AGENT_PROVIDER: ${AGENT_PROVIDER:-disabled}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_MODEL: ${AGENT_MODEL:-ministral-3:8b}
      AGENT_FALLBACK_MODEL: ${AGENT_FALLBACK_MODEL:-qwen3.5:9b}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_NUM_CTX: ${AGENT_NUM_CTX:-8192}
      AGENT_MIN_CONFIDENCE: ${AGENT_MIN_CONFIDENCE:-0.90}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-5}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
      AGENT_KEEP_ALIVE: ${AGENT_KEEP_ALIVE:-2m}
      GLM_OCR_ENABLED: ${GLM_OCR_ENABLED:-true}
      GLM_OCR_MODEL: ${GLM_OCR_MODEL:-glm-ocr:q8_0}
      GLM_OCR_MIN_CONFIDENCE: ${GLM_OCR_MIN_CONFIDENCE:-0.90}
      GLM_OCR_MAX_PAGES: ${GLM_OCR_MAX_PAGES:-1}
      GLM_OCR_NUM_CTX: ${GLM_OCR_NUM_CTX:-4096}
      GLM_OCR_KEEP_ALIVE: ${GLM_OCR_KEEP_ALIVE:-5m}
      DOCUMENT_CLASSIFIER_BACKEND: ${DOCUMENT_CLASSIFIER_BACKEND:-rules}
      DOCUMENT_CLASSIFIER_MODEL_DIR: ${DOCUMENT_CLASSIFIER_MODEL_DIR:-/models/modernbert}
      DOCUMENT_CLASSIFIER_MODEL_FILE: ${DOCUMENT_CLASSIFIER_MODEL_FILE:-onnx/model_int8.onnx}
      DOCUMENT_CLASSIFIER_PROVIDER: ${DOCUMENT_CLASSIFIER_PROVIDER:-cpu}
      DOCUMENT_CLASSIFIER_MAX_LENGTH: ${DOCUMENT_CLASSIFIER_MAX_LENGTH:-256}
      DOCUMENT_CLASSIFIER_RULE_THRESHOLD: ${DOCUMENT_CLASSIFIER_RULE_THRESHOLD:-0.90}
      DOCUMENT_CLASSIFIER_MODEL_THRESHOLD: ${DOCUMENT_CLASSIFIER_MODEL_THRESHOLD:-0.72}
      DOCUMENT_CLASSIFIER_MODEL_MARGIN: ${DOCUMENT_CLASSIFIER_MODEL_MARGIN:-0.08}
      DOCUMENT_CLASSIFIER_MODEL_VERSION: ${DOCUMENT_CLASSIFIER_MODEL_VERSION:-modernbert-base-zeroshot-v2.0-int8}
    volumes:
      - rpd-storage:/data/storage:ro
      - ./models:/models:ro
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json,urllib.request,sys
          data=json.load(urllib.request.urlopen("http://127.0.0.1:8000/health/ready",timeout=3))
          sys.exit(0 if data.get("ready") else 1)
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai-engine:
        condition: service_healthy
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://rpd:rpd@postgres:5432/rpd?sslmode=disable
      NATS_URL: nats://nats:4222
      STORAGE_ROOT: /data/storage
      AI_ENGINE_URL: http://ai-engine:8000
      NATIVE_ENGINE_PATH: /usr/local/bin/rpd-native-engine
      DEFAULT_TENANT_ID: 00000000-0000-0000-0000-000000000001
      AUTH_MODE: ${AUTH_MODE:-disabled}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      STORAGE_BACKEND: local
    volumes:
      - rpd-storage:/data/storage
    ports:
      - "8080:8080"
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai-engine:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rpd:rpd@postgres:5432/rpd?sslmode=disable
      NATS_URL: nats://nats:4222
      STORAGE_ROOT: /data/storage
      NATIVE_ENGINE_PATH: /usr/local/bin/rpd-native-engine
      AI_ENGINE_URL: http://ai-engine:8000
      AGENT_FALLBACK_ENABLED: ${AGENT_FALLBACK_ENABLED:-false}
      AGENT_MIN_CONFIDENCE: ${AGENT_MIN_CONFIDENCE:-0.90}
      STORAGE_BACKEND: local
    volumes:
      - rpd-storage:/data/storage
    restart: unless-stopped

  recon-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ["/usr/local/bin/rpd-recon-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://rpd:rpd@postgres:5432/rpd?sslmode=disable
      NATS_URL: nats://nats:4222
      STORAGE_ROOT: /data/storage
      STORAGE_BACKEND: local
    volumes:
      - rpd-storage:/data/storage
    restart: unless-stopped

volumes:
  rpd-postgres:
  rpd-nats:
  rpd-storage:
