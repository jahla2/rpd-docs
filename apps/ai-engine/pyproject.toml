[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpd-ai-engine"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2",
  "langchain-core>=1.2,<2",
  "langchain-ollama>=1.1,<2"
]

[project.optional-dependencies]
ocr = [
  "rapidocr>=3,<4",
  "rapid-table>=3,<4",
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.21,<1",
  "numpy>=1.26,<3",
  "pillow>=11,<12"
]
dev = [
  "pytest>=8,<9"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
