name: real-pdf-ocr-accuracy

on:
  pull_request:
    branches:
      - feat/mvp-foundation
    paths:
      - ".github/workflows/real-pdf-ocr-accuracy.yml"
      - "tests/end-to-end/real_pdf_accuracy.py"
      - "tests/fixtures/real-pdf-accuracy/**"
  workflow_dispatch:

jobs:
  real-pdf-ocr-accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          python -m pip install requests reportlab pillow

      - name: Reconstruct and verify uploaded PDF fixtures
        run: |
          set -euo pipefail
          mkdir -p /tmp/rpd-real-fixtures
          cat tests/fixtures/real-pdf-accuracy/chunk-*.b64 \
            | tr -d '\r\n' \
            | base64 --decode > /tmp/real-pdf-fixtures.tar.xz
          tar -xJf /tmp/real-pdf-fixtures.tar.xz -C /tmp/rpd-real-fixtures

          cd /tmp/rpd-real-fixtures
          echo "21faa5ec6c239755a1001540069ebd4a8e46afecc4038c57c042456e556eee02  (16) Bluewater Property Vare Ltd - Koruline Screening Services.pdf" | sha256sum -c -
          echo "e7d0439ea52101ab5a311fd0f0107e76cc1063c38cd2523f1fe86ed8a82e32d5  (17) Greenstone Facilities - BluePeak.pdf" | sha256sum -c -
          echo "6a727c6c692a67d4f3626c4e05db2153eadcf400fefdd25c2c7a8f972b3391a2  (18) Rimu Property - HarbourShield.pdf" | sha256sum -c -
          echo "001a1d1b52d4ac9b4389394e93e2c8fd51c6a8e84470963a7ddb7e60afb783d5  (19) Southfield Building Care - Southern Arc.pdf" | sha256sum -c -

      - name: Build and start full MVP stack
        run: docker compose up -d --build

      - name: Wait for API readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health/ready >/tmp/ready.json; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=250
          exit 1

      - name: Run real PDF OCR accuracy test
        env:
          RPD_BASE_URL: http://127.0.0.1:8080
          RPD_E2E_TIMEOUT: "300"
        run: |
          python tests/end-to-end/real_pdf_accuracy.py /tmp/rpd-real-fixtures
          echo "----- accuracy report -----"
          cat /tmp/real-pdf-accuracy.json

      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-pdf-ocr-accuracy-report
          path: /tmp/real-pdf-accuracy.json
          if-no-files-found: warn

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Stop stack
        if: always()
        run: docker compose down -v
